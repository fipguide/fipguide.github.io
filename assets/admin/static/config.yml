backend:
  name: github
  repo: fipguide/fipguide.github.io
  branch: main
  auth_scope: repo
  open_authoring: true
  site_domain: fipguide.netlify.app
  preview_context: netlify/fipguide-test/deploy-preview
  prompt_commit_messages: true
  cms_label_prefix: cms/
publish_mode: editorial_workflow
app_title: "FIP Guide CMS"
editor:
  preview: false
output:
  omit_empty_optional_fields: true
logo:
  src: /images/logo.svg
  show_in_header: true
media_folder: assets/images
public_folder: /images
media_libraries:
  all:
    slugify_filename: true
    max_file_size: 5242880
    transformations:
      raster_image:
        format: webp
        quality: 85
      svg:
        optimize: true
issue_reports:
  url: https://github.com/fipguide/fipguide.github.io/issues/new
display_url: https://fipguide.org/

i18n:
  structure: multiple_files
  locales: [en, de, fr]
  default_locale: en

x_fip_validity_target_fields_coupon: &fip_validity_target_fields_coupon
  - label: "Active Employees"
    name: "active"
    widget: "fip-validity-select"
    group_type: "fip-coupon"
    required: false
  - label: "Relatives of Active Employees"
    name: "active-relatives"
    widget: "fip-validity-select"
    group_type: "fip-coupon"
    required: false
  - label: "Retirees"
    name: "retired"
    widget: "fip-validity-select"
    group_type: "fip-coupon"
    required: false
  - label: "Relatives of Retirees"
    name: "retired-relatives"
    widget: "fip-validity-select"
    group_type: "fip-coupon"
    required: false
  - label: "Widows, Widowers and Orphans"
    name: "widows"
    widget: "fip-validity-select"
    group_type: "fip-coupon"
    required: false

x_fip_validity_target_fields_reduced: &fip_validity_target_fields_reduced
  - label: "Active Employees"
    name: "active"
    widget: "fip-validity-select"
    group_type: "fip-reduced-ticket"
    required: false
  - label: "Relatives of Active Employees"
    name: "active-relatives"
    widget: "fip-validity-select"
    group_type: "fip-reduced-ticket"
    required: false
  - label: "Retirees"
    name: "retired"
    widget: "fip-validity-select"
    group_type: "fip-reduced-ticket"
    required: false
  - label: "Relatives of Retirees"
    name: "retired-relatives"
    widget: "fip-validity-select"
    group_type: "fip-reduced-ticket"
    required: false
  - label: "Widows, Widowers and Orphans"
    name: "widows"
    widget: "fip-validity-select"
    group_type: "fip-reduced-ticket"
    required: false

collections:
  - name: "news"
    label: "News"
    label_singular: "News Article"
    editor:
      second_pane: false
    folder: "content/news"
    path: "{{slug}}/index"
    preview_path: "{{locale}}/news/{{slug}}/"
    slug:
      auto_increment: true
      hint: "A sequential number used as the article slug, e.g. 1."
      pattern: ["^[0-9]+$", "Must contain only numbers"]
    publish: false
    create: true
    delete: false
    i18n: true
    sortable_fields:
      fields: ["date", "title", "author"]
      default:
        field: "date"
        direction: "descending"
    fields:
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        i18n: duplicate
      - label: "Author"
        name: "author"
        widget: "string"
        i18n: duplicate
        required: false
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Description"
        name: "description"
        widget: "string"
        required: false
        i18n: true
      - label: "Countries"
        name: "country"
        widget: "relation"
        collection: "country"
        search_fields: ["title"]
        value_field: "country"
        display_fields: ["title"]
        multiple: true
        required: false
        i18n: duplicate
        hint: "List of countries this news article is about."
      - label: "Operators"
        name: "operator"
        widget: "relation"
        collection: "operator"
        search_fields: ["title"]
        value_field: "operator"
        display_fields: ["title"]
        multiple: true
        required: false
        i18n: duplicate
        hint: "List of operators this news article is about."
      - label: "Content Images"
        name: "content_images"
        widget: "image"
        multiple: true
        required: false
        i18n: duplicate
        hint: "Images shown for this page. Prefer .webp images."
        accept: "image/webp"
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        editor_components:
          - "image2"
          - "table"
          - "highlight"
          - "expander"
          - "button"
          - "dialog"
          - "dialog-trigger"
          - "float-image"
          - "wip"
          - "icon"
          - "footnote-reference"
          - "update"
          - "columns"
          - "footnote"

  - name: "country"
    label: "Countries"
    label_singular: "Country"
    editor:
      second_pane: false
    folder: "content/country"
    path: "{{slug}}/index"
    preview_path: "{{locale}}/country/{{slug}}/"
    thumbnail: "/images/flags/{{slug}}.webp"
    create: false
    publish: false
    delete: false
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Country"
        name: "country"
        widget: "string"
        i18n: duplicate
      - name: params
        label: "Parameters"
        widget: object
        i18n: true
        fields:
          - label: "Operators without FIP"
            name: operators_without_fip
            widget: list
            label_singular: "Operator"
            i18n: true
            hint: "List of operators in this country that do not accept FIP."
      - label: "Content Images"
        name: "content_images"
        widget: "image"
        multiple: true
        required: false
        i18n: duplicate
        hint: "Images shown for this page. Prefer .webp images."
        accept: "image/webp"
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        editor_components:
          - "image2"
          - "table"
          - "highlight"
          - "expander"
          - "button"
          - "dialog"
          - "dialog-trigger"
          - "float-image"
          - "wip"
          - "icon"
          - "footnote-reference"
          - "identify-operator"
          - "columns"
          - "footnote"

  - name: "operator"
    label: "Operators"
    label_singular: "Operator"
    editor:
      second_pane: false
    folder: "content/operator"
    path: "{{slug}}/index"
    preview_path: "{{locale}}/operator/{{slug}}/"
    publish: false
    create: false
    delete: false
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Countries"
        name: "country"
        widget: "relation"
        collection: "country"
        search_fields: ["title"]
        value_field: "country"
        display_fields: ["title"]
        multiple: true
        i18n: duplicate
        hint: "List of countries the operator operates in."
      - label: "Operator"
        name: "operator"
        widget: "string"
        i18n: duplicate
        hint: A unique identifier of the operator (slug).
      - label: "Content Images"
        name: "content_images"
        widget: "image"
        multiple: true
        required: false
        i18n: duplicate
        hint: "Images shown for this page. Prefer .webp images."
        accept: "image/webp"
      - label: "Aliases"
        name: "aliases"
        widget: "hidden"
        default: []
        i18n: duplicate
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        editor_components:
          - "image2"
          - "table"
          - "highlight"
          - "expander"
          - "fip-validity"
          - "train-category"
          - "booking"
          - "button"
          - "dialog"
          - "dialog-trigger"
          - "float-image"
          - "wip"
          - "icon"
          - "footnote-reference"
          - "columns"
          - "footnote"
          - "children-discount"

  - name: "application"
    label: "FIP Application"
    label_singular: "FIP Application Page"
    editor:
      second_pane: false
    folder: "content/application"
    path: "{{slug}}/index"
    preview_path: "{{locale}}/application/{{slug}}/"
    publish: false
    create: true
    delete: false
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        default: |
          <!--
            This page contains the issuer specific information for the issuance of FIP.
            In general, any information can be added that only concerns holders of FIP Cards of a specific issuer.
          -->

          ## Validity Period of the FIP Card

          <!--
            For which period is the FIP Card valid?
          -->

          ## Taxation

          <!--
            Is additional taxation of FIP benefits necessary for employees of this issuer?
          -->

          ## National Discounts (Non-FIP)

          <!--
            Which national (non-FIP) discounts can employees of this issuer use for travel abroad?
          -->

          ## FIP Coupon

          <!--
            How and when can employees of this issuer request FIP Coupons?
          -->

          {{< fip-validity-table type="fip-coupon" >}}

          ## FIP Reduced Ticket

          <!--
            How and when can employees of this issuer request FIP Reduced Tickets (FIP 50 / FIP 75)?
          -->

          {{< fip-validity-table type="fip-reduced-ticket" >}}
        editor_components:
          - "image2"
          - "table"
          - "highlight"
          - "expander"
          - "fip-validity-table"
          - "button"
          - "dialog"
          - "dialog-trigger"
          - "float-image"
          - "wip"
          - "icon"
          - "footnote-reference"
          - "columns"
          - "footnote"

  - name: "fip-validity"
    label: "FIP Validity Tables"
    label_singular: "FIP Validity Table"
    editor:
      second_pane: false
    folder: "content/application"
    path: "{{slug}}/validity"
    extension: "yaml"
    format: "yaml"
    summary: "{{dirname}}"
    create: true
    publish: false
    delete: false
    fields:
      - label: "Validity Groups"
        name: "groups"
        widget: "list"
        map_key_field: "id"
        summary: "{{fields.id}} ({{fields.type}}, {{fields.status}})"
        hint: "The validity groups available for this issuer. Referenced by ID in the Operators section below."
        fields:
          - label: "ID"
            name: "id"
            widget: "string"
            pattern:
              ["^[a-z0-9-]+$", "Use lowercase letters, digits and hyphens only"]
            hint: 'Unique identifier of this group, e.g. "coupon-1".'
          - label: "Type"
            name: "type"
            widget: "select"
            options:
              - label: "FIP Coupon"
                value: "fip-coupon"
              - label: "FIP Reduced Ticket"
                value: "fip-reduced-ticket"
            required: false
            hint: "Which FIP product this group applies to. Restricts which dropdowns it shows up in below. Leave unset to show it under both."
          - label: "Status"
            name: "status"
            widget: "select"
            options:
              - label: "Valid"
                value: "valid"
              - label: "Invalid"
                value: "invalid"
              - label: "Unknown"
                value: "unknown"
          - label: "Text"
            name: "text"
            widget: "object"
            fields:
              - label: "Deutsch"
                name: "de"
                widget: "markdown"
                editor_components:
                  - "icon"
                  - "footnote-reference"
                minimal: true
              - label: "English"
                name: "en"
                widget: "markdown"
                editor_components:
                  - "icon"
                  - "footnote-reference"
                minimal: true
              - label: "Français"
                name: "fr"
                widget: "markdown"
                editor_components:
                  - "icon"
                  - "footnote-reference"
                minimal: true
      - label: "Operators"
        name: "operators"
        widget: "list"
        map_key_field: "operator"
        collapsed: true
        summary: "{{fields.operator}}"
        hint: "For each target operator, select the applicable validity group per FIP product and target group."
        fields:
          - label: "Operator"
            name: "operator"
            widget: "relation"
            collection: "operator"
            search_fields: ["title"]
            value_field: "operator"
            display_fields: ["title"]
            hint: "The operator this validity information applies to."
          - label: "FIP Coupon"
            name: "fip-coupon"
            widget: "object"
            summary: "Target groups"
            hint: "Number and validity of FIP Coupons available to this target group."
            fields: *fip_validity_target_fields_coupon
          - label: "FIP Reduced Ticket"
            name: "fip-reduced-ticket"
            widget: "object"
            summary: "Target groups"
            hint: "Discount on FIP Reduced Tickets (FIP 50 / FIP 75) available to this target group."
            fields: *fip_validity_target_fields_reduced

  - name: "booking"
    label: "Booking Platforms"
    label_singular: "Booking Platform"
    editor:
      second_pane: false
    folder: "content/booking"
    path: "{{slug}}/index"
    preview_path: "{{locale}}/booking/{{slug}}/"
    publish: false
    create: true
    delete: false
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Description"
        name: "description"
        widget: "string"
        required: false
        i18n: true
      - label: "Aliases"
        name: "aliases"
        widget: "hidden"
        default: []
        i18n: duplicate
      - name: params
        label: "Parameters"
        widget: object
        i18n: true
        fields:
          - name: classes
            label: "Classes"
            widget: object
            required: false
            i18n: true
            fields:
              - label: "First Class"
                name: first
                widget: string
                required: false
              - label: "Second Class"
                name: second
                widget: string
                required: false
          - label: "FIP 50"
            name: fip_50
            widget: select
            options:
              - label: "Yes"
                value: true
              - label: "No"
                value: false
            required: false
            i18n: duplicate
          - label: "FIP Coupon"
            name: fip_coupon
            widget: select
            options:
              - label: "Yes"
                value: true
              - label: "No"
                value: false
            required: false
            i18n: duplicate
          - label: "FIP Global Fare"
            name: fip_global_fare
            widget: select
            options:
              - label: "Yes"
                value: true
              - label: "No"
                value: false
            required: false
            i18n: duplicate
          - label: "FIP 75"
            name: fip_75
            widget: select
            options:
              - label: "Yes"
                value: true
              - label: "No"
                value: false
            required: false
            i18n: duplicate
          - label: "Reservations"
            name: reservations
            widget: select
            options:
              - label: "Yes"
                value: true
              - label: "No"
                value: false
            required: false
            i18n: duplicate
          - label: "Booking Link"
            name: booking_link
            widget: string
            required: false
            i18n: duplicate
          - label: "Additional Info Link"
            name: additional_info_link
            widget: string
            required: false
            i18n: duplicate
          - label: "Fee"
            name: fee
            widget: string
            required: false
            i18n: duplicate
            hint: 'Fee for booking, e.g. "€ 5" or "5 %".'
          - label: "Type"
            name: type
            widget: select
            options:
              - label: "Website"
                value: "website"
              - label: "Online"
                value: "online"
              - label: "On-Site"
                value: "onsite"
              - label: "Telephone"
                value: "phone"
              - label: "Email"
                value: "email"
              - label: "Social Media"
                value: "socialmedia"
              - label: "Ticket Machine"
                value: "machine"
            i18n: duplicate
          - label: "Email Templates"
            name: email_templates
            widget: object
            required: false
            i18n: true
            hint: "Email templates for each booking type. Only used when Type is 'email'."
            fields:
              - label: "FIP 50"
                name: fip_50
                widget: object
                required: false
                i18n: true
                fields:
                  - label: "To"
                    name: to
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Subject"
                    name: subject
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Body"
                    name: body
                    widget: text
                    required: false
                    i18n: true
              - label: "FIP 75"
                name: fip_75
                widget: object
                required: false
                i18n: true
                fields:
                  - label: "To"
                    name: to
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Subject"
                    name: subject
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Body"
                    name: body
                    widget: text
                    required: false
                    i18n: true
              - label: "FIP Global Fare"
                name: fip_global_fare
                widget: object
                required: false
                i18n: true
                fields:
                  - label: "To"
                    name: to
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Subject"
                    name: subject
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Body"
                    name: body
                    widget: text
                    required: false
                    i18n: true
              - label: "Reservations"
                name: reservations
                widget: object
                required: false
                i18n: true
                fields:
                  - label: "To"
                    name: to
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Subject"
                    name: subject
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Body"
                    name: body
                    widget: text
                    required: false
                    i18n: true
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        default: |
          {{% booking-section "fip_50" %}}

          ## FIP 50 Tickets

          <!--
              Explain the steps for booking FIP 50 Tickets with this booking platform.
          -->

          {{% /booking-section %}}

          {{% booking-section "fip_global_fare" %}}

          ## FIP Global Fare

          <!--
              Explain the steps for booking FIP Global Fares with this booking platform.
          -->

          {{% /booking-section %}}

          {{% booking-section "reservations" %}}

          ## Reservations

          <!--
              Explain the steps for booking reservations with this booking platform.
          -->

          {{% /booking-section %}}
        editor_components:
          - "image2"
          - "table"
          - "highlight-raw"
          - "expander"
          - "booking-section"
          - "button"
          - "satellite"
          - "dialog"
          - "dialog-trigger"
          - "float-image"
          - "wip"
          - "icon"
          - "footnote-reference"
          - "columns"
          - "footnote"

