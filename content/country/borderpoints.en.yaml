    order: [ie-gb-rail, ie-gb-sll]
  - id: italy
    order: [at-it, it-si, gr-it, fr-it, it-ch]
    footnotes:
      - "[>] = Towards (e.g., Domodossola [> Locarno] = Domodossola is the border
        point towards Locarno)"
