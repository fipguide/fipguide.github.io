countries:
  austria:
    order: [at-cz, at-sk, at-hu-gysev, at-hu-mav, at-si, at-it, at-ch, at-de]
  belgium:
    order: [be-nl, be-de, be-lu, be-fr]
  bosnia-and-herzegovina:
    order: [ba-hr, ba-rs]
  bulgaria:
    order: [bg-ro, bg-tr, bg-gr, bg-rs]
  czechia:
    order: [cz-pl, cz-sk, at-cz, cz-de]
  denmark:
    order: [dk-se, dk-de]
  france:
    order: [fr-eurostar, be-fr, lu-fr, de-fr, fr-ch, fr-it, es-fr]
  germany:
    order:
      [
        dk-de,
        de-se,
        de-pl,
        cz-de,
        at-de,
        de-bsb,
        de-ch,
        de-fr,
        de-lu,
        be-de,
        de-eurostar,
        de-nl,
      ]
    footnotes:
      - "MS = Middle of the lake"
  greece:
    order: [gr-mk, bg-gr, gr-tr, gr-it]
    footnotes:
      - "[>] = In the direction of (e.g. Patras [> Ancona] = Patras is the border
        point in the direction of Ancona)"
  hungary:
    order:
      [
        hu-sk-mav,
        hu-sk-gysev,
        hu-ua,
        hu-ro,
        hu-rs,
        hu-hr,
        hu-si,
        at-hu-mav,
        at-hu-gysev,
      ]
  ireland:
    order: [ie-gb-rail, ie-gb-sll]
  italy:
    order: [at-it, it-si, gr-it, fr-it, it-ch]
    footnotes:
      - "[>] = Towards (e.g., Domodossola [> Locarno] = Domodossola is the border
        point towards Locarno)"
  latvia:
    order: [lv-ee, lv-ru, lv-by, lv-lt]
  lithuania:
    order: [lv-lt, lt-by, lt-pl, lt-ru]
  luxembourg:
    order: [be-lu, de-lu, lu-fr]
  montenegro:
    order: [me-rs]
  netherlands:
    order: [de-nl, be-nl, nl-gb-stl]
  norway:
    order: [no-se]
  poland:
    order: [pl-ru, lt-pl, pl-by, pl-ua, pl-sk, cz-pl, de-pl]
  portugal:
    order: [pt-es]
    footnotes:
      - "[>] = Direction (for example: V. Real de Sto António Guardiana [>
        Ayamonte] = the border point at V. Real de Sto António Guardiana is
        oriented towards Ayamonte)"
  romania:
    order: [ro-ua, ro-md, bg-ro, ro-rs, hu-ro]
  serbia:
    order: [hu-rs, ro-rs, bg-rs, rs-mk, me-rs, ba-rs, rs-hr]
  slovakia:
    order: [hu-sk-gysev, hu-sk-mav, cz-sk]
  slovenia:
    order: [it-si, si-hr, at-si, hu-si]
  spain:
    order: [pt-es, es-fr]
  switzerland:
    order: [de-ch, at-ch, it-ch, fr-ch]
    footnotes:
      - "[>] = Direction (e.g. Locarno [> Domodossola] = Locarno is the border
        point towards Domodossola)"
  united-kingdom:
    order: [nl-gb-stl, gb-eurostar, ie-gb-rail, ie-gb-sll, gb-gb-sll]

