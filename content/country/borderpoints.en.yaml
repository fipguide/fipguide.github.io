        de-bsb,
        de-ch,
        de-fr,
        de-lu,
        be-de,
        de-eurostar,
        de-nl,
      ]
    footnotes:
      - "MS = Middle of the lake"
  - id: greece
    order: [gr-mk, bg-gr, gr-tr, gr-it]
    footnotes:
      - "[>] = In the direction of (e.g. Patras [> Ancona] = Patras is the border
        point in the direction of Ancona)"
  - id: hungary
    order:
      [
        hu-sk-mav,
        hu-sk-gysev,
        hu-ua,
        hu-ro,
        hu-rs,
        hu-hr,
        hu-si,
        at-hu-mav,
