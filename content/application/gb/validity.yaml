# This file shows the rules for FIP cards issued by GB (National Rail).
groups:
- name: coupon-not-available
  status: invalid
  text:
    de: Nicht verfügbar
    en: Not available
    fr: Non disponible
- name: reduced-50
  status: valid
  text:
    de: 50 % Rabatt
    en: 50 % discount
    fr: 50 % de réduction
- name: reduced-75
  status: valid
  text:
    de: 75 % Rabatt
    en: 75 % discount
    fr: 75 % de réduction
- name: coupon-active-1
  status: valid
  text:
    de: |
      **1 Freifahrtschein**
      <small>Pro Jahr.</small>
    en: |
      **1 coupon**
      <small>Per year.</small>
    fr: |
      **1 coupon**
      <small>Par an.</small>
- name: coupon-active-2
  status: valid
  text:
    de: |
      **2 Freifahrtscheine**
      <small>Pro Jahr.</small>
    en: |
      **2 coupons**
      <small>Per year.</small>
    fr: |
      **2 coupons**
      <small>Par an.</small>
