groups:
  - name: coupon-4fields
    status: valid
    text:
      de: >
        **1 Freifahrtschein**

        <small>Mit jeweils 4 Feldern pro Jahr. Jedes Feld ist zwei Tage gültig.</small>
      en: >
        **1 coupon**

        <small>With 4 fields each per year. Each field is valid for two days.</small>
      fr: >
        **1 coupon**

        <small>Avec 4 champs chacun par an. Chaque champ est valable deux jours.</small>
    type: fip-coupon
  - name: coupon-not-available
    status: invalid
    text:
      de: Nicht verfügbar
      en: Not available
      fr: Non disponible
    type: fip-coupon
  - name: coupon-crossing
    status: valid
    text:
      de: >
        **1 Freifahrtschein**

        <small>Mit jeweils 2 Feldern pro Jahr. Jedes Feld ist für eine Überfahrt gültig.</small>
      en: >
        **1 coupon**

        <small>With 2 fields each per year. Each field is valid for one crossing.</small>
      fr: >
        **1 coupon**

        <small>Avec 2 champs chacun par an. Chaque champ est valable pour une traversée.</small>
    type: fip-coupon
  - name: coupon-former-1-onetime
    status: valid
    text:
      de: |
        **1 Freifahrtschein**
        <small>Einmalig, innerhalb von 45 Monaten nach Austritt.</small>
      en: |
        **1 coupon**
        <small>One-time, within 45 months after leaving.</small>
      fr: |
        **1 coupon**
        <small>Unique, dans les 45 mois suivant le départ.</small>
    type: fip-coupon
  - name: reduced-50
    status: valid
    text:
      de: 50 % Rabatt
      en: 50 % discount
      fr: 50 % de réduction
    type: fip-reduced-ticket
operators:
  bdz:
    fip-coupon:
      active: coupon-4fields
      active-relatives: coupon-4fields
      retired: coupon-former-1-onetime
      retired-relatives: coupon-not-available
    fip-reduced-ticket:
      active: reduced-50
      active-relatives: reduced-50
      retired: reduced-50
