# This file shows the rules for FIP cards issued by ÖBB.
_anchors:
  coupon-not-available: &coupon-not-available
    status: invalid
    text:
      de: "Nicht verfügbar"
      en: "Not available"
      fr: "Non disponible"
  reduced-50: &reduced-50
    status: valid
    text:
      de: "50 % Rabatt"
      en: "50 % discount"
      fr: "50 % de réduction"
  reduced-50-group: &reduced-50-group
    active: *reduced-50
    active-relatives: *reduced-50
    retired: *reduced-50
    retired-relatives: *reduced-50
    widows: *reduced-50
  reduced-no-discount: &reduced-no-discount
    status: invalid
    text:
      de: "Kein Rabatt"
      en: "No discount"
      fr: "Pas de réduction"
  coupon-1: &coupon-1
    status: valid
    text:
      de: >
        **1 Freifahrtschein**
        <small>
        nur Vollzeit
        </small>
      en: >
        **1 coupon**
        <small>
        Full-time only
        </small>
      fr: >
        **1 coupon**
        <small>
        Temps plein uniquement
        </small>
  coupon-1-1: &coupon-1-1
    status: valid
    text:
      de: >
        **1 Freifahrtschein**
        <small>
        Vollzeit
        <hr>
        Teilzeit (mind. 50%): 1 Freifahrtschein
        </small>
      en: >
        **1 coupon**
        <small>
        Full-time
        <hr>
        Part-time (min. 50%): 1 coupon
        </small>
      fr: >
        **1 coupon**
        <small>
        Temps plein
        <hr>
        Temps partiel (min. 50%): 1 coupon
        </small>
  coupon-2-1: &coupon-2-1
    status: valid
    text:
      de: >
        **2 Freifahrtscheine**
        <small>
        Vollzeit
        <hr>
        Teilzeit (mind. 50%): 1 Freifahrtschein
        </small>
      en: >
        **2 coupons**
        <small>
        Full-time
        <hr>
        Part-time (min. 50%): 1 coupon
        </small>
      fr: >
        **2 coupons**
        <small>
        Temps plein
        <hr>
        Temps partiel (min. 50%): 1 coupon
        </small>
  coupon-3-1: &coupon-3-1
    status: valid
    text:
      de: >
        **3 Freifahrtscheine**
        <small>
        Vollzeit
        <hr>
        Teilzeit (mind. 50%): 1 Freifahrtschein
        </small>
      en: >
        **3 coupons**
        <small>
        Full-time
        <hr>
        Part-time (min. 50%): 1 coupon
        </small>
      fr: >
        **3 coupons**
        <small>
        Temps plein
        <hr>
        Temps partiel (min. 50%): 1 coupon
        </small>
  coupon-y1-9x1-45x0: &coupon-y1-9x1-45x0
    status: valid
    text:
      de: >
        **1 / 1 / 0 Freifahrtscheine**
        <small>
        Jährlich: 1 Freifahrtschein
        <hr>
        **Einmalig innerhalb von 9 Monaten** nach Versetzung in den Ruhestand: 1 Freifahrtschein
        <hr>
        **Einmalig innerhalb von 45 Monaten** nach Versetzung in den Ruhestand: 0 Freifahrtscheine
        </small>
