<dialog
  id="{{ .ID }}"
  class="o-dialog__wrapper"
  aria-labelledby="{{ .ID }}-title"
>
  <div class="o-dialog o-container">
    <header class="o-dialog__header">
      <h1 id="{{ .ID }}-title" class="o-dialog__title">{{ .Title }}</h1>
      {{- partial "button" (dict "Text" (partial "icon" "close") "Title" (i18n "dialog.close")) -}}
    </header>
    <div
      class="o-dialog__body{{ with .Actions }}
        o-dialog__body--with-actions
      {{ end }}"
    >
      {{- .Content | safeHTML -}}
    </div>
    {{- with .Actions }}
      <footer class="o-dialog__actions">
        <div class="o-dialog__actions-content">{{ . | safeHTML }}</div>
      </footer>
    {{- end }}
  </div>
</dialog>
