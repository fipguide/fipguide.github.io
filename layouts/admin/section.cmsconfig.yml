            i18n: true
          - label: "Body"
            name: "body"
            widget: "markdown"
            i18n: true
            editor_components:
              - "image"
              - "highlight"
              - "expander"
              - "button"
              - "dialog"
              - "float-image"
              - "wip"
              - "columns"
