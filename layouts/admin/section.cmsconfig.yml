backend:
  name: github
  repo: fipguide/fipguide.github.io
  branch: "{{ or (os.Getenv "FIPGUIDE_BRANCH") "main" }}"
  auth_scope: repo
  open_authoring: true
  site_domain: fipguide.netlify.app
publish_mode: editorial_workflow
logo:
  src: /images/logo.svg
  show_in_header: true
media_folder: assets/images
public_folder: /images
issue_reports:
  url: https://github.com/fipguide/fipguide.github.io/issues/new
display_url: https://fipguide.org/

i18n:
  structure: multiple_files
  locales: [en, de, fr]
  default_locale: en

collections:
  - name: "news"
    label: "News"
    label_singular: "News Article"
    folder: "content/news"
    path: "{{"{{"}}slug}}/index"
    publish: false
    create: true
    delete: false
    i18n: true
    editor:
      preview: false
    fields:
      - label: "Publish Date"
        name: "date"
        widget: "datetime"
        i18n: duplicate
      - label: "Author"
        name: "author"
        widget: "string"
        i18n: duplicate
        required: false
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Description"
        name: "description"
        widget: "string"
        required: false
        i18n: true
      - label: "Countries"
        name: "country"
        widget: "relation"
        collection: "country"
        search_fields: ["title"]
        value_field: "country"
        display_fields: ["title"]
        multiple: true
        required: false
        i18n: duplicate
        hint: "List of countries this news article is about."
      - label: "Operators"
        name: "operator"
        widget: "relation"
        collection: "operator"
        search_fields: ["title"]
        value_field: "operator"
        display_fields: ["title"]
        multiple: true
        required: false
        i18n: duplicate
        hint: "List of operators this news article is about."
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        editor_components:
          - "image"
          - "highlight"
          - "expander"
          - "button"
          - "dialog"
          - "float-image"
          - "wip"
          - "update"
          - "columns"

  - name: "country"
    label: "Countries"
    label_singular: "Country"
    folder: "content/country"
    path: "{{"{{"}}slug}}/index"
    create: false
    publish: false
    delete: false
    i18n: true
    editor:
      preview: false
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Country"
        name: "country"
        widget: "string"
        i18n: duplicate
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        editor_components:
          - "image"
          - "highlight"
          - "expander"
          - "button"
          - "dialog"
          - "float-image"
          - "wip"
          - "identify-operator"
          - "columns"

  - name: "operator"
    label: "Operators"
    label_singular: "Operator"
    folder: "content/operator"
    path: "{{"{{"}}slug}}/index"
    publish: false
    delete: false
    i18n: true
    editor:
      preview: false
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Countries"
        name: "country"
        widget: "relation"
        collection: "country"
        search_fields: ["title"]
        value_field: "country"
        display_fields: ["title"]
        multiple: true
        i18n: duplicate
        hint: "List of countries the operator operates in."
      - label: "Operator"
        name: "operator"
        widget: "string"
        i18n: duplicate
        hint: A unique identifier of the operator (slug).
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        editor_components:
          - "image"
          - "highlight"
          - "expander"
          - "fip-validity"
          - "train-category"
          - "booking"
          - "button"
          - "dialog"
          - "float-image"
          - "wip"
          - "columns"

  - name: "application"
    label: "FIP Application"
    label_singular: "FIP Application Page"
    folder: "content/application"
    path: "{{"{{"}}slug}}/index"
    publish: false
    create: true
    delete: false
    i18n: true
    editor:
      preview: false
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        default: |
          <!--
            This page contains the issuer specific information for the issuance of FIP.
            In general, any information can be added that only concerns holders of FIP Cards of a specific issuer.
          -->

          ## Validity Period of the FIP Card

          <!--
            For which period is the FIP Card valid?
          -->

          ## Taxation

          <!--
            Is additional taxation of FIP benefits necessary for employees of this issuer?
          -->

          ## National Discounts (Non-FIP)

          <!--
            Which national (non-FIP) discounts can employees of this issuer use for travel abroad?
          -->

          ## FIP Coupon

          <!--
            How and when can employees of this issuer request FIP Coupons?
          -->

          {{"{{"}}< fip-validity-table type="fip-coupon" >}}

          ## FIP Reduced Ticket

          <!--
            How and when can employees of this issuer request FIP Reduced Tickets (FIP 50 / FIP 75)?
          -->

          {{"{{"}}< fip-validity-table type="fip-reduced-ticket" >}}
        editor_components:
          - "image"
          - "highlight"
          - "expander"
          - "fip-validity-table"
          - "button"
          - "dialog"
          - "float-image"
          - "wip"
          - "columns"

  - name: "fip-validity"
    label: "FIP Validity Tables"
    label_singular: "FIP Validity Table"
    hide: false
    files:
{{- range (sort (where site.RegularPages "Type" "operator") "File.ContentBaseName") }}
{{- $slug := .File.ContentBaseName }}
{{- $appPage := site.GetPage (printf "/application/%s" $slug) }}
{{- if and $appPage ($appPage.Resources.Get "validity.yaml") }}
      - name: {{ printf "%q" $slug }}
        label: {{ printf "%q" .Title }}
        file: {{ printf "%q" (printf "content/application/%s/validity.yaml" $slug) }}
        editor:
          preview: false
        fields:
          - label: "Validity Groups"
            name: "groups"
            widget: "list"
            summary: "{{"{{"}}fields.name}} ({{"{{"}}fields.type}}, {{"{{"}}fields.status}})"
            hint: "The validity groups available for this issuer. Referenced by name in the Operators section below."
            fields:
              - label: "Name"
                name: "name"
                widget: "string"
                hint: 'Unique identifier of this group, e.g. "coupon-1".'
              - label: "Type"
                name: "type"
                widget: "select"
                options: ["fip-coupon", "fip-reduced-ticket"]
                required: false
                hint: "Which FIP product this group applies to. Leave unset to show it under both."
              - label: "Status"
                name: "status"
                widget: "select"
                options: ["valid", "invalid", "unknown"]
              - label: "Text"
                name: "text"
                widget: "object"
                fields:
                  - label: "Deutsch"
                    name: "de"
                    widget: "markdown"
                    editor_components: []
                    minimal: true
                  - label: "English"
                    name: "en"
                    widget: "markdown"
                    editor_components: []
                    minimal: true
                  - label: "Français"
                    name: "fr"
                    widget: "markdown"
                    editor_components: []
                    minimal: true
          - label: "Operators"
            name: "operators"
            widget: "object"
            collapsed: true
            hint: "For each target operator, select the applicable validity group per FIP product and target group."
            fields:
{{- range (sort (where site.RegularPages "Type" "operator") "File.ContentBaseName") }}
              - label: {{ printf "%q" .Title }}
                name: {{ printf "%q" .File.ContentBaseName }}
                widget: "object"
                collapsed: true
                fields:
                  - label: "FIP Coupon"
                    name: "fip-coupon"
                    widget: "object"
                    hint: "Number and validity of FIP Coupons available to this target group."
                    fields:
{{- range $fieldName, $fieldLabel := (dict "active" "Active Employees" "active-relatives" "Relatives of Active Employees" "retired" "Retirees" "retired-relatives" "Relatives of Retirees" "widows" "Widows, Widowers and Orphans") }}
                      - label: {{ printf "%q" $fieldLabel }}
                        name: {{ printf "%q" $fieldName }}
                        widget: "relation"
                        collection: "fip-validity"
                        file: {{ printf "%q" $slug }}
                        required: false
                        value_field: "{{"{{"}}groups.*.name}}"
                        display_fields: ["{{"{{"}}groups.*.name}} ({{"{{"}}groups.*.type}}, {{"{{"}}groups.*.status}})"]
                        search_fields: ["{{"{{"}}groups.*.name}}"]
{{- end }}
                  - label: "FIP Reduced Ticket"
                    name: "fip-reduced-ticket"
                    widget: "object"
                    hint: "Discount on FIP Reduced Tickets (FIP 50 / FIP 75) available to this target group."
                    fields:
{{- range $fieldName, $fieldLabel := (dict "active" "Active Employees" "active-relatives" "Relatives of Active Employees" "retired" "Retirees" "retired-relatives" "Relatives of Retirees" "widows" "Widows, Widowers and Orphans") }}
                      - label: {{ printf "%q" $fieldLabel }}
                        name: {{ printf "%q" $fieldName }}
                        widget: "relation"
                        collection: "fip-validity"
                        file: {{ printf "%q" $slug }}
                        required: false
                        value_field: "{{"{{"}}groups.*.name}}"
                        display_fields: ["{{"{{"}}groups.*.name}} ({{"{{"}}groups.*.type}}, {{"{{"}}groups.*.status}})"]
                        search_fields: ["{{"{{"}}groups.*.name}}"]
{{- end }}
{{- end }}
{{- end }}
{{- end }}

  - name: "booking"
    label: "Booking Platforms"
    label_singular: "Booking Platform"
    folder: "content/booking"
    path: "{{"{{"}}slug}}/index"
    publish: false
    create: true
    delete: false
    i18n: true
    editor:
      preview: false
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Description"
        name: "description"
        widget: "string"
        required: false
        i18n: true
      - name: params
        label: "Parameters"
        widget: object
        i18n: true
        fields:
          - name: classes
            label: "Classes"
            widget: object
            required: false
            i18n: true
            fields:
              - label: "First Class"
                name: first
                widget: string
                required: false
                i18n: duplicate
              - label: "Second Class"
                name: second
                widget: string
                required: false
                i18n: duplicate
          - label: "FIP 50"
            name: fip_50
            widget: boolean
            default: false
            i18n: duplicate
          - label: "FIP Global Fare"
            name: fip_global_fare
            widget: boolean
            default: false
            required: false
            i18n: duplicate
          - label: "FIP 75"
            name: fip_75
            widget: boolean
            default: false
            required: false
            i18n: duplicate
          - label: "Reservations"
            name: reservations
            widget: boolean
            default: false
            i18n: duplicate
          - label: "Booking Link"
            name: booking_link
            widget: string
            required: false
            i18n: duplicate
          - label: "Additional Info Link"
            name: additional_info_link
            widget: string
            required: false
            i18n: duplicate
          - label: "Fee"
            name: fee
            widget: string
            required: false
            i18n: duplicate
            hint: 'Fee for booking, e.g. "€ 5" or "5 %".'
          - label: "Type"
            name: type
            widget: select
            options:
              [website, online, onsite, phone, email, socialmedia, machine]
            i18n: duplicate
          - label: "Email Templates"
            name: email_templates
            widget: object
            required: false
            collapsed: true
            i18n: true
            hint: "Email templates for each booking type. Only used when Type is 'email'."
            fields:
              - label: "FIP 50"
                name: fip_50
                widget: object
                required: false
                i18n: true
                fields:
                  - label: "To"
                    name: to
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Subject"
                    name: subject
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Body"
                    name: body
                    widget: text
                    required: false
                    i18n: true
              - label: "FIP 75"
                name: fip_75
                widget: object
                required: false
                i18n: true
                fields:
                  - label: "To"
                    name: to
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Subject"
                    name: subject
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Body"
                    name: body
                    widget: text
                    required: false
                    i18n: true
              - label: "FIP Global Fare"
                name: fip_global_fare
                widget: object
                required: false
                i18n: true
                fields:
                  - label: "To"
                    name: to
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Subject"
                    name: subject
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Body"
                    name: body
                    widget: text
                    required: false
                    i18n: true
              - label: "Reservations"
                name: reservations
                widget: object
                required: false
                i18n: true
                fields:
                  - label: "To"
                    name: to
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Subject"
                    name: subject
                    widget: string
                    required: false
                    i18n: duplicate
                  - label: "Body"
                    name: body
                    widget: text
                    required: false
                    i18n: true
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        default: |
          {{"{{"}}% booking-section "fip_50" %}}

          ## FIP 50 Tickets

          <!--
              Explain the steps for booking FIP 50 Tickets with this booking platform.
          -->

          {{"{{"}}% /booking-section %}}

          {{"{{"}}% booking-section "fip_global_fare" %}}

          ## FIP Global Fare

          <!--
              Explain the steps for booking FIP Global Fares with this booking platform.
          -->

          {{"{{"}}% /booking-section %}}

          {{"{{"}}% booking-section "reservations" %}}

          ## Reservations

          <!--
              Explain the steps for booking reservations with this booking platform.
          -->

          {{"{{"}}% /booking-section %}}
        editor_components:
          - "image"
          - "highlight-raw"
          - "expander"
          - "booking-section"
          - "button"
          - "satellite"
          - "dialog"
          - "float-image"
          - "wip"
          - "columns"

