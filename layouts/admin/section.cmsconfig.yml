  - name: "faq"
    label: "FAQ"
    label_singular: "FAQ Entry"
    folder: "content/general/faq"
    path: "{{"{{"}}slug}}/index"
    preview_path: "{{"{{"}}locale}}/general/faq/{{"{{"}}slug}}/"
    publish: false
    create: true
    delete: false
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - label: "Weight"
        name: "weight"
        widget: "number"
