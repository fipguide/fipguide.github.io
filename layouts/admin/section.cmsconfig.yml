  - name: "identify-operator"
    label: "Identify Operator"
    label_singular: "Identify Operator"
    folder: "content/identify-operator"
    path: "{{"{{"}}slug}}/index"
    publish: false
    create: true
    delete: false
    i18n: true
    editor:
      preview: false
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
      - name: params
        label: "Parameters"
