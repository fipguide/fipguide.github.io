        fields:
          - label: "URL"
            name: url
            widget: string
            required: false
            i18n: duplicate
      - label: "Body"
        name: "body"
        widget: "markdown"
        i18n: true
        editor_components:
          - "image"
          - "highlight"
          - "expander"
          - "button"
          - "dialog"
          - "float-image"
          - "wip"
          - "columns"
