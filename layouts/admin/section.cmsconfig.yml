          - "expander"
          - "button"
          - "dialog"
          - "float-image"
          - "wip"
          - "columns"
          - "footnote"

  - name: "identify-operator"
    label: "Identify Operator"
    label_singular: "Identify Operator"
    folder: "content/identify-operator"
    path: "{{"{{"}}slug}}/index"
    preview_path: "{{"{{"}}locale}}/identify-operator/{{"{{"}}slug}}/"
    publish: false
    create: true
    delete: false
    i18n: true
    fields:
      - label: "Title"
        name: "title"
        widget: "string"
        i18n: true
